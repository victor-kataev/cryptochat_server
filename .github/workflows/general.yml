name: General

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  instal_and_run:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydb
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U myuser" --health-interval 10s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests (fail fast)
        run: uv run pytest tests/unit/ -x --tb=short -q

      # - name: Lint & type check
      #   run: uvx ruff check app/

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydb
          TEST_DATABASE_URL: postgresql://myuser:mypassword@localhost:5432/mydb
        run: |
          uv run alembic upgrade head
          uv run pytest tests/integration/ -v -q --tb=short --junitxml=reports/junit.xml

      - name: Build docker image
        run: docker build -t chat-app:${{ github.sha }} .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # - name: Upload image
      #   run: |
      #     docker tag chat-app:${{ github.sha }} ghcr.io/${{ github.repository }}/chat-app:${{ github.sha }}
      #     docker push ghcr.io/${{ github.repository }}/chat-app --all-tags

      - name: Doploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secretes.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~
            mkdir 123githubactions