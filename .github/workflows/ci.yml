name: Experimental

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.put-versions.outputs.platforms }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Put versions
        id: put-versions
        run: |
          echo "platforms=[linux, darwin, windows]" >> $GITHUB_OUTPUT

  platform-runs:
    runs-on: ubuntu latest
    needs:
      - ci
    strategy:
      matrix:
        platform: ${{ ci.outputs.platforms }}

    steps:
      - name: Test run
        run: |
          echo "Running test for platform: ${{ matrix.platform }}"
